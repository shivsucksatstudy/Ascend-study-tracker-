<script>
try{document.documentElement.dataset.th=localStorage.getItem('rvx_theme')||'default'}catch(e){}
const K='studytracker_v1';const DAYMAX=24;

const iso=d=>{const x=new Date(d);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const T=()=>iso(Date.now()+(localStorage.getItem('rvx_dev')==='1'?(+localStorage.getItem('rvx_devoff')||0)*864e5:0));
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STRM={'Science (Medical)':{core:['Physics','Chemistry','Biology','English'],tag:'PCB'},'Science (Non-Medical)':{core:['Physics','Chemistry','Mathematics','English'],tag:'PCM'},Commerce:{core:['Accountancy','Business Studies','Economics','English'],tag:''},Humanities:{core:['History','Political Science','Geography','English'],tag:''},'All subjects':{core:['Mathematics','Science','English','Hindi','History','Geography','Political Science','Economics'],tag:''}};
const OPT=new Set(['Physical Education','Yoga','Painting','Computer Science','Informatics Practices','Psychology','Sociology','Sanskrit']);
const LEGS={Commerce:['Business Studies','Accountancy','Economics'],Arts:['Economics','History','Political Science','Geography']};
let S,loadErr=0,saveBad=0;
function norm(o){o=o&&typeof o==='object'?o:{};const dt=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)?x:null,cl=['10','11','12'].includes(String(o.cls))?String(o.cls):'12',st=STRM[o.stream]?o.stream:(o.stream==='Arts'?'Humanities':(cl==='10'?'All subjects':'Commerce')),sb=(Array.isArray(o.subs)&&o.subs.length)?o.subs.filter(x=>typeof x==='string'&&x&&x.length<40).slice(0,20):(LEGS[o.stream]||STRM[st].core.slice()),obj=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
 const tp=(Array.isArray(o.topics)?o.topics:[]).filter(t=>t&&typeof t==='object'&&t.id&&t.name).map(t=>({id:String(t.id).replace(/[^\w-]/g,'_'),subj:String(t.subj||''),ch:String(t.ch||'General'),name:String(t.name),diff:['Easy','Medium','Hard'].includes(t.diff)?t.diff:'Medium',imp:!!t.imp,studied:!!t.studied,stage:Math.max(0,+t.stage||0),last:dt(t.last),due:dt(t.due),notes:String(t.notes||''),
  qs:(Array.isArray(t.qs)?t.qs:[]).filter(q=>q&&q.id&&((q.type==='text'||q.type==='link')?typeof q.v==='string':(q.type==='img'||q.type==='pdf'))).map(q=>({...q,id:String(q.id).replace(/[^\w-]/g,'_')})),
  logs:(Array.isArray(t.logs)?t.logs:[]).filter(l=>l&&dt(l.d)).map(l=>({d:l.d,h:Math.min(24,Math.max(0,+l.h||0)),self:+l.self||0,quiz:(l.quiz===null||l.quiz===undefined||l.quiz==='')?null:+l.quiz}))}));
 tp.forEach(t=>{if(t.studied){if(!t.last)t.last=(t.logs.length&&t.logs[t.logs.length-1].d)||T();if(!t.due)t.due=addD(t.last,ivl(t))}});
 return{cls:cl,stream:st,subs:sb,topics:(localStorage.getItem('rvx_clean4')?tp:tp.filter(t=>!(t.name===t.ch&&!t.studied&&!(t.logs&&t.logs.length)&&!t.notes&&!(t.qs&&t.qs.length)))),hours:Object.fromEntries(Object.entries(obj(o.hours)).filter(([k,v])=>dt(k)&&+v>0).map(([k,v])=>[k,Math.min(24,+v)])),goal:Math.min(16,Math.max(.5,+o.goal||3)),exam:Object.fromEntries(Object.entries(obj(o.exam)).filter(([k,v])=>dt(v))),done:obj(o.done),arena:AR(o.arena),papers:(Array.isArray(o.papers)?o.papers:[]).filter(p=>p&&p.id&&typeof p.subj==='string').map(p=>({id:String(p.id).replace(/[^\w-]/g,'_'),subj:p.subj,d:dt(p.d)||T(),sc:(p.sc===null||p.sc===undefined||p.sc==='')?null:Math.min(100,Math.max(0,+p.sc||0))})),goals:(Array.isArray(o.goals)?o.goals:[]).filter(g=>g&&g.id&&g.name).map(g=>({id:String(g.id).replace(/[^\w-]/g,'_'),name:String(g.name).slice(0,40),h:Math.min(12,Math.max(.5,+g.h||1)),time:/^\d{2}:\d{2}$/.test(g.time)?g.time:'',tp:(Array.isArray(g.tp)?g.tp:[]).map(String)}))}}
let r0=null,noStore=0;try{r0=localStorage.getItem(K)}catch(e){noStore=1}
try{S=norm(r0?JSON.parse(r0):{})}catch(e){loadErr=1;S=norm({});try{localStorage.setItem(K+'_bad',r0)}catch(x){}}
const vt=()=>S.topics.filter(t=>S.subs.includes(t.subj));
const warn=m=>{const e=document.getElementById('warn');if(!e)return;e.textContent=m||'';e.style.display=m?'block':'none'};
const save=()=>{if(loadErr||window.__wipe)return;try{mirror()}catch(e){}try{localStorage.setItem(K,JSON.stringify(S));if(saveBad){saveBad=0;warn('')}}catch(e){saveBad=1;warn('Could not save. Storage is blocked or full. Copy a backup from More now.')}};
let WM=noStore?'Storage is blocked here, so nothing will be saved. Open this file in Chrome or use the installed app.':loadErr?'Your saved data could not be read, so changes are not being saved. Restore a backup in More.':'';
warn(WM);
window.addEventListener('error',e=>warn('Error: '+(e.message||'unknown')));
let armed=null;function twice(k){if(armed===k){armed=null;warn(WM);return true}armed=k;warn('Tap delete again to confirm');setTimeout(()=>{if(armed===k){armed=null;warn(WM)}},3000);return false}

let tab='today',logId=null;
const LB='studytracker_lb';
// 4 backup nudge
const lbDays=()=>{try{const v=localStorage.getItem(LB);return v?diffD(T(),v):null}catch(e){return null}};
const lbText=()=>{const n=lbDays();return n===null?'No backup made yet.':n===0?'Last backup: today.':'Last backup: '+n+' days ago.'};
function bkNudge(){const n=lbDays();if(!S.topics.length||(n!==null&&n<7))return '';return `<div class="card row"><div><b>Back up your data</b><div class="mu">${lbText()}</div></div><button onclick="tab='more';render()">Back up</button></div>`}
const $=id=>document.getElementById(id);

// Adaptive revision: base gap grows with each good review, shrinks for hard or important topics
function ivl(t){const b=[1,3,7,21,45][Math.min(t.stage,4)];let f=1;if(t.diff==='Hard')f*=.6;if(t.diff==='Easy')f*=1.5;if(t.imp)f*=.7;return Math.max(1,Math.round(b*f))}
function sc(l){const a=[];if(l.self)a.push(l.self/5);if(l.quiz!==null&&l.quiz!==undefined&&l.quiz!=='')a.push(l.quiz/100);return a.length?a.reduce((x,y)=>x+y)/a.length:null}
const hLeft=d=>Math.max(0,DAYMAX-(S.hours[d||T()]||0)),hMsg=m=>{warn(m);setTimeout(()=>warn(WM),3200)};
function hClamp(e){const m=+e.max;if(+e.value>m)e.value=m;if(+e.value<0)e.value=0}
function logStudy(t,h,self,quiz){
  h=Math.max(0,Math.min(+h||0,hLeft()));const l={d:T(),h,self,quiz};t.logs.push(l);
  if(h)S.hours[T()]=(S.hours[T()]||0)+h;
  const p=sc(l);
  if(!t.studied){t.studied=true;t.stage=0}
  else if(p===null||p>=.5)t.stage++;else t.stage=0;
  t.last=T();t.due=addD(T(),ivl(t));save();
}
function chips(t){return (t.diff==='Hard'?'<span class="chip">Hard</span>':'')+(t.imp?'<span class="chip i">Important</span>':'')+(t.studied?`<span class="chip">Revise ${t.due<=T()?'today':'on '+t.due}</span>`:'<span class="chip">Not studied yet</span>')}
function row(t,extra){return `<div class="card row"><div><b>${esc(t.name)}</b><div class="mu">${esc(t.subj)}, ${esc(t.ch)}${extra||''}</div>${chips(t)}</div><div class="row" style="gap:6px;flex:none"><button class="g" onclick="sm('${t.id}')">Start</button><button onclick="openLog('${t.id}')">Log</button></div></div>`}

const ready=t=>{if(!t.studied)return 0;const a=t.logs.map(sc).filter(x=>x!==null),b=a.length?a[a.length-1]:.6;return Math.max(0,b-Math.max(0,diffD(T(),t.due))*.04)};
function streak(){let n=0,d=T();if(!S.hours[d])d=addD(d,-1);while(S.hours[d]>0){n++;d=addD(d,-1)}return n}
const SND='rvx_snd',snd=()=>{try{return localStorage.getItem(SND)!=='0'}catch(e){return 1}};let AC=null,_busy=0;
let lastCel=0;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(a,b,t0,d,v,ty){const c=ac();if(!c)return;const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;o.type=ty||'sine';o.frequency.setValueAtTime(a,t);if(b!==a)o.frequency.exponentialRampToValueAtTime(b,t+d*.85);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03)}
const SC=[330,370,415,494,554,659];
function kal(f,t0,d,v){tone(f,f,t0,d,v)}
function pop(){if(!snd())return;try{tone(330,250,0,.07,.05)}catch(e){}}
function tabSnd(i){if(!snd())return;try{tone(300,260,0,.06,.04)}catch(e){}}
function tick(){if(!snd())return;try{tone(240,200,0,.05,.035)}catch(e){}}
function zoop(){lastCel=Date.now();if(!snd())return;try{[392,494,587].forEach((f,i)=>tone(f,f,i*.1,i==2?.5:.22,.08))}catch(e){}}
const MOT={neutral:[[3]],happy:[[2,4]],excited:[[2,4,5]],laughing:[[4,3,4]],pleased:[[2,4]],flirty:[[3,5]],prank:[[4,2]],surprised:[[1,5]],shy:[[4]],embarrassed:[[4,3]],confused:[[2,4]],suspicious:[[1],.8],annoyed:[[2,0]],bored:[[1],.8],tired:[[2,0],.8],sleepy:[[3,1],.7],sad:[[3,1],.8],crying:[[3,1,0],.8],overwhelmed:[[5,3,5]]};
