name: Build and deploy Ascend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp a new version into the service worker
        run: |
          V="ascend-${GITHUB_SHA::7}"
          sed -i "s/const V='[^']*'/const V='$V'/" sw.js
          grep -q "const V='$V'" sw.js
          echo "Version: $V"

      - name: Assemble site
        run: |
          mkdir -p _site/assets _site/icons
          cp index.html sw.js manifest.webmanifest _site/
          cp en.js _site/assets/
          cp icon-192.png icon-512.png maskable-512.png apple-touch-icon.png favicon-32.png _site/icons/
          touch _site/.nojekyll
          ls -R _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
