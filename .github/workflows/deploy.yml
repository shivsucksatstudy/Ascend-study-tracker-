name: Build and deploy Ascend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp a new version into the service worker
        run: |
          V="ascend-${GITHUB_SHA::7}"
          sed -i "s/const V='[^']*'/const V='$V'/" sw.js
          grep -q "const V='$V'" sw.js
          echo "Version: $V"

      - name: Check required files
        run: |
          for f in index.html sw.js manifest.webmanifest assets/en.js icons/icon-192.png icons/icon-512.png; do
            test -s "$f" || { echo "Missing $f"; exit 1; }
          done

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest assets icons _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
